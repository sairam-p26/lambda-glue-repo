name: Deploy AWS S3 Lambda Glue Pipeline

on:

  push:

    branches:
      - main


permissions:

  id-token: write

  contents: read


jobs:

  deploy:

    name: Deploy to AWS

    runs-on: ubuntu-latest


    steps:

      # ---------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ---------------------------------------------------
      # AWS OIDC
      # ---------------------------------------------------

      - name: Configure AWS credentials using OIDC

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume:
            ${{ secrets.AWS_ROLE_ARN }}

          aws-region:
            us-east-1


      # ---------------------------------------------------
      # VERIFY AWS
      # ---------------------------------------------------

      - name: Verify AWS identity

        run: |

          aws sts get-caller-identity


      # ---------------------------------------------------
      # VALIDATE CLOUDFORMATION
      # ---------------------------------------------------

      - name: Validate CloudFormation template

        run: |

          aws cloudformation validate-template \
            --template-body file://s3-lambda-glue-cf-oidc-repo/template.yaml \
            --region us-east-1


      # ---------------------------------------------------
      # DEPLOY CLOUDFORMATION
      # ---------------------------------------------------

      - name: Deploy CloudFormation stack

        run: |

          aws cloudformation deploy \
            --template-file s3-lambda-glue-cf-oidc-repo/template.yaml \
            --stack-name s3-lambda-glue-pipeline \
            --capabilities CAPABILITY_NAMED_IAM \
            --region us-east-1


      # ---------------------------------------------------
      # GET CREATED S3 BUCKET
      # ---------------------------------------------------

      - name: Get S3 bucket name

        id: bucket

        run: |

          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name s3-lambda-glue-pipeline \
            --query "Stacks[0].Outputs[?OutputKey=='DataBucketName'].OutputValue" \
            --output text \
            --region us-east-1)

          echo "Bucket: $BUCKET_NAME"

          echo "bucket_name=$BUCKET_NAME" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------
      # UPLOAD GLUE SCRIPT
      # ---------------------------------------------------

      - name: Upload Glue script

        run: |

          aws s3 cp \
            s3-lambda-glue-cf-oidc-repo/src/glue/job.py \
            s3://${{ steps.bucket.outputs.bucket_name }}/glue/job.py \
            --region us-east-1


      # ---------------------------------------------------
      # UPLOAD SAMPLE INPUT
      # ---------------------------------------------------

      - name: Upload sample input

        run: |

          aws s3 cp \
            s3-lambda-glue-cf-oidc-repo/sample/input.csv \
            s3://${{ steps.bucket.outputs.bucket_name }}/input/input.csv \
            --region us-east-1


      # ---------------------------------------------------
      # DEPLOYMENT COMPLETE
      # ---------------------------------------------------

      - name: Deployment summary

        run: |

          echo "=========================================="

          echo "AWS S3 Lambda Glue Pipeline deployed"

          echo "=========================================="

          echo "S3 Bucket:"
          echo "${{ steps.bucket.outputs.bucket_name }}"

          echo ""

          echo "Glue script uploaded"

          echo ""

          echo "Sample input uploaded"

          echo ""

          echo "Pipeline:"
          echo "S3 -> EventBridge -> Lambda -> Glue"

          echo ""

          echo "Output:"
          echo "S3 -> output/ -> city/state/country partitions"

          echo "=========================================="
