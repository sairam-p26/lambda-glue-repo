name: Deploy AWS S3 Lambda Glue Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://s3-lambda-glue-cf-oidc-repo/template.yaml \
            --region us-east-1

      - name: Deploy CloudFormation stack
        id: deploy
        continue-on-error: true
        run: |
          aws cloudformation deploy \
            --template-file s3-lambda-glue-cf-oidc-repo/template.yaml \
            --stack-name s3-lambda-glue-pipeline \
            --capabilities CAPABILITY_NAMED_IAM \
            --region us-east-1

      - name: Show CloudFormation events
        if: always()
        run: |
          echo "========================================="
          echo "CLOUDFORMATION STACK EVENTS"
          echo "========================================="

          aws cloudformation describe-stack-events \
            --stack-name s3-lambda-glue-pipeline \
            --region us-east-1 \
            --query "StackEvents[?contains(ResourceStatus,'FAILED')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true

      - name: Check deployment result
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "CloudFormation deployment FAILED."
          exit 1

      - name: Get S3 bucket name
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name s3-lambda-glue-pipeline \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='DataBucketName'].OutputValue" \
            --output text)

          echo "S3 Bucket: $BUCKET_NAME"
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV

      - name: Upload Glue script
        run: |
          aws s3 cp \
            s3-lambda-glue-cf-oidc-repo/glue/job.py \
            s3://$BUCKET_NAME/glue/job.py

      - name: Upload sample input
        run: |
          aws s3 cp \
            s3-lambda-glue-cf-oidc-repo/sample-data/employees.csv \
            s3://$BUCKET_NAME/input/employees.csv

      - name: Deployment summary
        run: |
          echo "========================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "========================================="
          echo "S3 Bucket: $BUCKET_NAME"
          echo "Glue Job: city-state-country-partition-job"
          echo "Input: s3://$BUCKET_NAME/input/employees.csv"
          echo "Output: s3://$BUCKET_NAME/output/"
          echo "========================================="
