AWSTemplateFormatVersion: '2010-09-09'

Description: S3 -> EventBridge -> Lambda -> Glue partitioned Parquet pipeline

Parameters:

  DataBucketName:
    Type: String
    Default: ''
    Description: Optional globally unique S3 bucket name. Leave empty for a generated name.

  GlueJobName:
    Type: String
    Default: city-state-country-partition-job

Conditions:

  HasCustomBucketName: !Not [!Equals [!Ref DataBucketName, '']]

Resources:

  # ---------------------------------------------------------
  # S3 BUCKET
  # ---------------------------------------------------------

  DataBucket:
    Type: AWS::S3::Bucket

    Properties:

      BucketName: !If
        - HasCustomBucketName
        - !Ref DataBucketName
        - !Ref AWS::NoValue

      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256


  # ---------------------------------------------------------
  # LAMBDA IAM ROLE
  # ---------------------------------------------------------

  LambdaExecutionRole:
    Type: AWS::IAM::Role

    Properties:

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: LambdaPipelinePolicy

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              # CloudWatch Logs
              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: '*'


              # Read input CSV
              - Effect: Allow

                Action:
                  - s3:GetObject

                Resource: !Sub '${DataBucket.Arn}/input/*'


              # Start Glue Job
              - Effect: Allow

                Action:
                  - glue:StartJobRun

                Resource: !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/${GlueJobName}'


  # ---------------------------------------------------------
  # LAMBDA FUNCTION
  # ---------------------------------------------------------

  LambdaFunction:
    Type: AWS::Lambda::Function

    Properties:

      Runtime: python3.12

      Handler: index.lambda_handler

      Role: !GetAtt LambdaExecutionRole.Arn

      Timeout: 60

      MemorySize: 256

      Environment:

        Variables:

          GLUE_JOB_NAME: !Ref GlueJobName

      Code:

        ZipFile: |

          import csv
          import io
          import json
          import os
          import urllib.parse

          import boto3


          s3 = boto3.client("s3")
          glue = boto3.client("glue")


          REQUIRED_COLUMNS = {
              "city",
              "state",
              "country"
          }


          def lambda_handler(event, context):

              print(json.dumps(event))


              detail = event.get("detail", {})


              bucket = detail.get(
                  "bucket",
                  {}
              ).get(
                  "name"
              )


              key = urllib.parse.unquote_plus(
                  detail.get(
                      "object",
                      {}
                  ).get(
                      "key",
                      ""
                  )
              )


              if not bucket or not key:

                  raise ValueError(
                      "Missing bucket/key in EventBridge event"
                  )


              if not key.startswith("input/"):

                  return {
                      "status": "ignored",
                      "reason": "Not an input object"
                  }


              if not key.lower().endswith(".csv"):

                  return {
                      "status": "ignored",
                      "reason": "Not a CSV file"
                  }


              response = s3.get_object(
                  Bucket=bucket,
                  Key=key
              )


              body = response["Body"].read(
                  1024 * 1024
              ).decode(
                  "utf-8-sig"
              )


              lines = body.splitlines()


              first_line = (
                  lines[0]
                  if lines
                  else ""
              )


              reader = csv.reader(
                  io.StringIO(first_line)
              )


              columns = {
                  c.strip().lower()
                  for c in next(reader, [])
              }


              missing = sorted(
                  REQUIRED_COLUMNS - columns
              )


              if missing:

                  print(
                      f"Validation failed. Missing columns: {missing}"
                  )

                  return {
                      "status": "validation_failed",
                      "bucket": bucket,
                      "key": key,
                      "missing_columns": missing
                  }


              job_name = os.environ[
                  "GLUE_JOB_NAME"
              ]


              run = glue.start_job_run(

                  JobName=job_name,

                  Arguments={

                      "--SOURCE_BUCKET": bucket,

                      "--SOURCE_KEY": key,

                      "--OUTPUT_PATH":
                          f"s3://{bucket}/output/"
                  }
              )


              print(
                  f"Started Glue job: {run['JobRunId']}"
              )


              return {

                  "status": "glue_started",

                  "job_name": job_name,

                  "job_run_id":
                      run["JobRunId"],

                  "source":
                      f"s3://{bucket}/{key}"
              }


  # ---------------------------------------------------------
  # GLUE IAM ROLE
  # ---------------------------------------------------------

  GlueServiceRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub 'AWSGlueServiceRole-${AWS::StackName}'

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service: glue.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole

      Policies:

        - PolicyName: GlueS3PipelineAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              # Read source data
              - Effect: Allow

                Action:
                  - s3:GetObject
                  - s3:ListBucket

                Resource:

                  - !GetAtt DataBucket.Arn

                  - !Sub '${DataBucket.Arn}/*'


              # Write output
              - Effect: Allow

                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload

                Resource:
                  - !Sub '${DataBucket.Arn}/output/*'


  # ---------------------------------------------------------
  # GLUE JOB
  # ---------------------------------------------------------

  GlueJob:
    Type: AWS::Glue::Job

    Properties:

      Name: !Ref GlueJobName

      Role: !GetAtt GlueServiceRole.Arn

      GlueVersion: '4.0'

      WorkerType: G.1X

      NumberOfWorkers: 2

      Command:

        Name: glueetl

        PythonVersion: '3'

        ScriptLocation:
          !Sub 's3://${DataBucket}/glue/job.py'

      DefaultArguments:

        '--job-language': 'python'

        '--enable-metrics': 'true'

        '--enable-continuous-cloudwatch-log': 'true'

        '--SOURCE_BUCKET':
          !Ref DataBucket

        '--OUTPUT_PATH':
          !Sub 's3://${DataBucket}/output/'

      ExecutionProperty:

        MaxConcurrentRuns: 1


  # ---------------------------------------------------------
  # EVENTBRIDGE RULE
  # ---------------------------------------------------------

  S3ObjectCreatedRule:
    Type: AWS::Events::Rule

    Properties:

      Description:
        Trigger Lambda when a CSV lands in the input prefix

      EventPattern:

        source:
          - aws.s3

        detail-type:
          - Object Created

        detail:

          bucket:

            name:
              - !Ref DataBucket

          object:

            key:
              - prefix: input/

      Targets:

        - Arn:
            !GetAtt LambdaFunction.Arn

          Id:
            LambdaTarget


  # ---------------------------------------------------------
  # LAMBDA PERMISSION
  # ---------------------------------------------------------

  EventBridgeLambdaPermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref LambdaFunction

      Action:
        lambda:InvokeFunction

      Principal:
        events.amazonaws.com

      SourceArn:
        !GetAtt S3ObjectCreatedRule.Arn


# ---------------------------------------------------------
# OUTPUTS
# ---------------------------------------------------------

Outputs:

  DataBucketName:

    Description:
      S3 bucket used by the pipeline

    Value:
      !Ref DataBucket


  LambdaFunctionName:

    Description:
      Validation Lambda

    Value:
      !Ref LambdaFunction


  GlueJobName:

    Description:
      Glue ETL job

    Value:
      !Ref GlueJob


  OutputPath:

    Description:
      Partitioned Parquet output

    Value:
      !Sub 's3://${DataBucket}/output/'
